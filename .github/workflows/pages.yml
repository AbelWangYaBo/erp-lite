# GitHub Pages 部署：发布 pages/ 静态介绍页到 https://abelwangyabo.github.io/erp-lite/
# 注意：Pages 只托管项目介绍页（无后端，ERP 业务界面不可在线运行）。
# 完整系统请按 README「本地开发」步骤启动。

name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
