services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
      POSTGRES_DB: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不暴露宿主端口（避免与本机既有 PostgreSQL 冲突），仅容器网络内可访问

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp123@db:5432/erp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ERP_ADMIN_USER: ${ERP_ADMIN_USER:-admin}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    # 不对外暴露端口，由 web 的 nginx 反代 /api；调试时可改为 "18001:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      # 本机 8080 已被其他服务占用，改用 18080
      - "18080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
